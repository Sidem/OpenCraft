[workspace]
resolver = "3"
members = ["crates/engine"]

[workspace.package]
edition = "2021"
rust-version = "1.87"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Keep debug builds usable: terrain generation and meshing are far too slow at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
