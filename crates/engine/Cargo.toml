[package]
name = "opencraft-engine"
version = "0.1.0"
description = "OpenCraft simulation core: world, terrain generation, meshing, physics"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
rustc-hash = "2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O3",
  "--enable-simd",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-reference-types",
  "--enable-multivalue",
]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
